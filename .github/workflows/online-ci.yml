name: Online Duel checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: online-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dozenwar_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dozenwar_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dozenwar_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_TEST_URL: postgresql://postgres:dozenwar_ci@127.0.0.1:5432/dozenwar_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and offline regression gates
        run: npm run build
      - name: Server regression with PostgreSQL
        run: npm run test:server
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Two-player browser flow and server restart
        run: npm run test:online-browser
      - name: Delays, lost acknowledgements, disconnects and reloads
        run: npm run test:online-network
      - name: Build production container
        run: docker build -t dozenwar-online:benchmark .
      - name: Small load regression with real PostgreSQL and resource limits
        run: npm run benchmark:online -- --skip-build --rooms 4 --seconds 12 --output work/online-load/ci.json
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-checks-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/online-browser/*.png
            work/online-network/*.png
            work/online-network/report.json
            work/online-load/ci.json
            work/online-load/docker.log
