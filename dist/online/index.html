<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DozenWar · Online 1v1</title>
    <link rel="stylesheet" href="./style.css?v=1.74.1" />
    <link rel="stylesheet" href="../assets/ui/dw-style-01/theme.css?v=1.74.1" />
<link rel="stylesheet" href="../assets/ui/dw-style-01/concept-fidelity.css?v=1.74.1">
<link rel="stylesheet" href="../assets/ui/dw-style-01/pack.css?v=1.74.1">
    <script defer src="./config.js"></script>
    <script defer src="../assets/heroes-camera-06/catalog.js?v=1.74.1"></script>
    <script defer src="../assets/troops-camera-team/catalog.js?v=1.74.1"></script>
<script defer src="../assets/heroes-camera-06/renderer.js?v=1.74.1"></script>
<script defer src="../assets/skills/heroes-simple-dw-style-01/catalog.js?v=1.74.1"></script>
<script defer src="../assets/ui/dw-style-01/pack.js?v=1.74.1"></script>
<script defer src="../assets/ui/dw-style-01/concept-skins.js?v=1.74.1"></script>
    <script defer src="../assets/ui/dw-style-01/pack-runtime.js?v=1.74.1"></script>
<script defer src="./client.js?v=1.74.1"></script>
  </head>
  <body class="dwUI dwOnline" data-build-version="1.74.1">
    <header>
      <a href="../">DOZEN WAR <b>II</b></a
      ><span>ONLINE · ĐỐI ĐẦU 1V1</span
      ><output id="connection" aria-live="polite">Đang kết nối…</output>
    </header>
    <main>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="lobby">
        <h1>Chơi cùng bạn bè</h1>
        <label
          >Tên người chơi<input
            id="playerName"
            maxlength="32"
            autocomplete="nickname"
            value="Player" /></label
        ><button class="btn gold" id="createRoom">Tạo phòng</button
        ><label
          >Mã phòng<input
            id="roomCode"
            maxlength="8"
            autocomplete="off"
            spellcheck="false" /></label
        ><button class="btn primary" id="joinRoom">Vào phòng</button>
        <p>
          Gửi mã phòng cho người chơi còn lại. Hai người dùng hai trình duyệt
          hoặc thiết bị riêng.
        </p>
      </section>
      <section id="room" hidden>
        <div class="roomHeader">
          <strong id="roomLabel"></strong><span id="players"></span
          ><output id="clock"></output
          ><button class="btn" id="sync">Kết nối lại / Đồng bộ</button
          ><button class="btn" id="leave">Rời phòng</button>
          <div id="onlineTurnAction"></div>
        </div>
        <div id="setup"></div>
        <div class="arena">
          <svg
            id="board"
            viewBox="0 0 1000 900"
            aria-label="Bàn cờ DozenWar"
            role="img"
          ></svg>
        </div>
        <div id="onlineDock" class="onlineDock" data-tab="hero">
        <section id="onlineActorInfo" class="onlineActorPanel" aria-label="Hero hoặc đơn vị đang chọn"></section>
        <section id="controls" aria-label="Hành động"></section>
        <section id="onlineCardsPanel" class="onlineHandPanel">
          <h2>Trang bị của bạn</h2>
          <div id="hand" class="hand"></div>
          <p id="opponentHand"></p>
        </section>
        </div>
        <nav id="onlineTabs" class="dwDockTabs" aria-label="Điều khiển trong trận" role="tablist">
          <button type="button" class="dwDockTab" data-online-tab="hero" role="tab" aria-controls="onlineActorInfo" aria-selected="true">HERO</button>
          <button type="button" class="dwDockTab" data-online-tab="skills" role="tab" aria-controls="controls" aria-selected="false" tabindex="-1">KỸ NĂNG</button>
          <button type="button" class="dwDockTab" data-online-tab="cards" role="tab" aria-controls="onlineCardsPanel" aria-selected="false" tabindex="-1">TRANG BỊ</button>
        </nav>
        <details class="onlineEvents">
          <summary>Diễn biến trận</summary>
          <ol id="events"></ol>
        </details>
      </section>
    </main>
  </body>
</html>
